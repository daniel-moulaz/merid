# Banco de desenvolvimento local.
# Subir:   npm run db:up
# Derrubar: npm run db:down   (os dados ficam no volume `db_data`)
services:
  db:
    image: postgres:17-alpine
    container_name: app_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app_dev_password
      POSTGRES_DB: app_dev
      # Garante que o cluster nasça em UTC. Todos os timestamps são timestamptz,
      # mas isso evita surpresas em funções como now()/current_date no psql.
      TZ: UTC
      PGTZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
